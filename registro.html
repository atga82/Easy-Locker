<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Locker | Registro</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="encabezado">
        <a class="marca" href="index.html">
            <span class="marca-simbolo">
                <img src="Logo.png" alt="Logo de Easy Locker">
            </span>
            <span>Easy <b>Locker</b></span>
        </a>

        <button class="boton-menu" id="botonMenu">☰</button>

        <nav class="navegacion" id="navegacion">
            <a href="index.html">Inicio</a>
            <a class="activo" href="registro.html">Registro</a>
            <a href="casilleros.html">Casilleros</a>
            <a href="planes.html">Planes</a>
            <a href="cuenta.html">Mi cuenta</a>
        </nav>
    </header>

    <main class="seccion pagina-formulario">
        <div class="seccion-titulo">
            <h1>Registro de alumnos</h1>
            <p>Crea una cuenta para solicitar y administrar tu casillero.</p>
        </div>

        <form class="formulario" id="formRegistro">
            <div class="campo">
                <label for="nombre">Nombre(s)</label>
                <input id="nombre" type="text" required placeholder="Ingresa tu nombre">
            </div>

            <div class="campo">
                <label for="apellidos">Apellido(s)</label>
                <input id="apellidos" type="text" required placeholder="Ingresa tus apellidos">
            </div>

            <div class="campo">
                <label for="matricula">Matrícula</label>
                <input id="matricula" type="text" required placeholder="Ingresa tu matrícula">
            </div>

            <div class="campo">
                <label for="correo">Correo institucional</label>
                <input id="correo" type="email" required placeholder="ejemplo@uanl.edu.mx">
            </div>

            <div class="campo">
                <label for="facultad">Facultad</label>
                <select id="facultad" required>
                    <option value="">Selecciona tu facultad</option>
                    <option>Facultad de Ciencias Físico-Matemáticas</option>
                    <option>Facultad de Ingeniería Mecánica y Eléctrica</option>
                    <option>Facultad de Artes Visuales</option>
                    <option>Otra facultad</option>
                </select>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input id="contrasena" type="password" required minlength="6" placeholder="Crea una contraseña">
            </div>

            <div class="campo">
                <label for="confirmar">Confirmar contraseña</label>
                <input id="confirmar" type="password" required placeholder="Repite la contraseña">
            </div>

            <label class="check">
                <input id="terminos" type="checkbox" required>
                Acepto los términos y condiciones.
            </label>

            <button class="boton boton-principal" type="submit">Registrarme</button>

            <p class="mensaje" id="mensajeRegistro"></p>
        </form>
    </main>

    <footer class="pie">
        <p>Easy Locker · Proyecto académico universitario</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
